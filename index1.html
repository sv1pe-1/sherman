<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование машины</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">НашСайт</div>
            <nav class="nav">
                <a href="#">Характеристики</a>
                <a href="#">Контакты</a>
            </nav>
            <div class="user-icon-placeholder">
                <img src="img/image 4.png" alt="ddd">
            </div>
        </header>

        <main class="booking-card">
            <h1 class="form-title">Узнать цену и забронировать машину</h1>
            
            <form action="#" method="post" class="booking-form">
                <div class="row">
                    <input type="text" placeholder="Ваше имя" class="input-field">
                    <input type="email" placeholder="Ваш email" class="input-field">
                    <input type="tel" placeholder="Ваш номер" class="input-field">
                </div>

                <div class="row">
                    <select class="input-field select-field">
                        <option value="" disabled selected>Какой автомобиль ↓</option>
                    </select>
                    
                    <input type="text" placeholder="Дата бронирования" class="input-field">
                    <input type="text" placeholder="На сколько" class="input-field">
                </div>

                <div class="row-full">
                    <textarea placeholder="Дополнительный текст" class="textarea-field"></textarea>
                </div>

                <button type="submit" class="submit-button">Узнать цену</button>
            </form>
        </main>
    </div>
</body>
</html>
